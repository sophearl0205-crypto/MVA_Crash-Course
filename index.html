--line);border-radius:12px;background:#fff}.stat b{display:block;font-size:25px}.tabs{display:flex;gap:5px;border-bottom:1px solid var(--line);padding:12px 18px 0;overflow:auto}.tab{padding:11px 13px;background:transparent;border-bottom:3px solid transparent;white-space:nowrap}.tab.on{border-color:var(--brand);color:var(--brand);font-weight:800}.content{padding:22px}.lesson h3{margin-top:24px}.lesson li{margin:8px 0}.callout{padding:14px 16px;background:var(--soft);border-left:4px solid var(--brand);border-radius:8px;margin:14px 0}.notice{padding:13px 15px;background:var(--warnbg);border-left:4px solid var(--warn);border-radius:8px}.source{font-size:13px;color:var(--muted)}.source a{color:var(--brand)}.question{padding:16px 0;border-top:1px solid var(--line)}.option{display:block;padding:9px 10px;margin:5px 0;border:1px solid var(--line);border-radius:9px}.option:hover{background:#f8fafc}.result{margin-top:8px;font-weight:700}.textarea{width:100%;min-height:145px;border:1px solid #cfd4dc;border-radius:10px;padding:11px;resize:vertical}.task{padding:17px 0;border-top:1px solid var(--line)}.rubric{display:grid;grid-template-columns:1fr 100px;gap:8px;align-items:center}.rubric select,.profile input{padding:9px;border:1px solid #cfd4dc;border-radius:8px;background:white}.scorebox{padding:16px;border-radius:12px;background:#f8fafc;border:1px solid var(--line);margin-top:15px}.skillrow{display:grid;grid-template-columns:190px 1fr 55px;gap:10px;align-items:center;margin:10px 0}.skillbar{height:9px;background:#e5e7eb;border-radius:99px}.skillbar i{display:block;height:100%;background:var(--brand);border-radius:99px}.locked{opacity:.55}.dashboard{display:grid;gap:18px}.modulecard{padding:17px;border:1px solid var(--line);border-radius:13px}.modulecard h3{margin:0 0 4px}.modulecard .small{font-size:13px;color:var(--muted)}.modulecard button{margin-top:10px}.sim{display:grid;grid-template-columns:180px 1fr;gap:0;border:1px solid var(--line);border-radius:12px;overflow:hidden;min-height:300px}.simnav{background:#f8fafc;border-right:1px solid var(--line);padding:10px}.simnav button{display:block;width:100%;padding:10px;background:transparent;text-align:left;border-radius:8px}.simnav button.on{background:#e9efff;color:var(--brand);font-weight:800}.simbody{padding:18px}.field{display:grid;grid-template-columns:1fr 1fr;gap:10px}.field input{width:100%;padding:9px;border:1px solid #cfd4dc;border-radius:8px}.mini{font-size:12px;color:var(--muted)}@media(max-width:900px){.layout{grid-template-columns:1fr}.side{position:static}.grid{grid-template-columns:1fr}.skillrow{grid-template-columns:130px 1fr 45px}.sim{grid-template-columns:1fr}.simnav{border-right:0;border-bottom:1px solid var(--line)}}

<header class="top"><div class="topin"><h1>MVA Launchpad <span style="font-size:14px;background:#ffffff22;padding:5px 9px;border-radius:99px">V3</span></h1><p>Adaptive MVA training • practice • simulation • readiness</p><div id="topstats">0% complete</div><div class="progress"><i id="bar"></i></div></div></header>
<div class="layout"><aside class="side"><h3>Training</h3><div id="nav"></div><div class="actions"><button class="primary" onclick="showDashboard()">Dashboard</button><button class="secondary" onclick="showCoach()">🤖 Coach</button><button class="secondary" onclick="showWorkday()">🧑‍💻 Workday</button><button class="secondary" onclick="showInterview()">🎤 Interview</button><button class="secondary" onclick="showReadiness()">📊 Readiness</button><button class="secondary" onclick="exportData()">Export Progress</button><button class="secondary" onclick="importFile()">Import Progress</button><button class="danger" onclick="resetAll()">Reset</button><input id="file" type="file" accept="application/json" hidden onchange="readImport(event)"></div></aside><main id="app"></main></div>
<script>
const modules=[
{id:'foundations',title:'MVA Foundations',desc:'Understand the role, boundaries, workflow and professional mindset.',skill:'Foundations',minutes:12,lesson:[['What an MVA does','A Medical Virtual Assistant supports administrative and coordination work around healthcare services. Common work includes scheduling, patient communication, documentation, data entry, inbox management, referrals, insurance/admin support and follow-up. The exact duties depend on the employer and its SOPs.'],['Stay inside the role','An MVA should not diagnose, prescribe, change a treatment plan, interpret clinical results, or make medication decisions unless the employer has explicitly assigned a lawful, trained, authorized workflow. When a request crosses your role, pause and escalate.'],['The core habit','A strong MVA thinks: What is the request? What information do I need? What system or SOP applies? What can I do myself? What must be escalated? What should I document?'],['Before you act','Verify identity according to the organization’s process, use approved systems, record only what is needed, communicate clearly, and close the loop.']],
quiz:[['A patient asks you to change their medication dose. What is the best response?',['Guess based on the label','Make the change if they insist','Follow the approved escalation process; do not make the clinical decision','Tell them what you personally would do'],2,'Clinical decisions are outside a typical MVA role unless a specific authorized workflow says otherwise.'],['Which sequence is strongest for a new administrative request?',['Act immediately → document later','Understand → verify → follow SOP → act/escalate → document','Ask a friend → improvise','Ignore unclear requests'],1,'A repeatable workflow reduces errors and makes escalation explicit.'],['Which is an appropriate MVA responsibility?',['Diagnosing a symptom','Prescribing medication','Scheduling an appointment','Changing a treatment plan'],2,'Scheduling is a common administrative responsibility; clinical decisions are not.']],
practice:[['Role boundary response','A patient messages: “My blood pressure is high. Tell me if I should take another tablet.” Write the response you would send as an MVA.', 'Use a calm tone, avoid clinical advice, and explain the next step.'],['Workflow mapping','Write a 6-step workflow for receiving an appointment request and getting it completed correctly.','Include verification, availability, confirmation, documentation and escalation if relevant.']],
assessment:[['Boundary scenario','A patient requests medication advice, then becomes frustrated when you will not answer. Write the exact message you would send and the internal action you would take.',20],['Administrative workflow','Describe how you would process an appointment request from first message through documentation.',20]]},
{id:'communication',title:'Healthcare Communication',desc:'Write clear, empathetic and professional patient-facing messages.',skill:'Communication',minutes:15,lesson:[['The professional structure','A useful patient message usually has: greeting, acknowledgement, action or answer within your role, next step, and a polite close. Keep it readable.'],['Avoid risky language','Do not promise an appointment, diagnosis, outcome, refund, medication change or clinical result unless the workflow authorizes that promise. Avoid slang, sarcasm, blame and unnecessary details.'],['De-escalation','When someone is upset: acknowledge the concern, avoid arguing, state what you can do, give the next step, and escalate when needed.'],['Example','Instead of “You missed your appointment,” use: “I’m sorry we missed you today. I can help you check the next available appointment options.”']],
quiz:[['Best response to an upset patient?',['Argue that policy is policy','Acknowledge, clarify what you can do, and provide the next step','Promise anything to end the call','Ignore the message'],1,'Professional communication is calm, specific and action-oriented.'],['Which wording is safest when availability is unknown?',['You are definitely booked Wednesday','Wednesday is available, I promise','I can check Wednesday’s availability for you','You have no choice'],2,'Check first; do not promise availability before confirming.'],['A clear patient message should generally be:',['Long and technical','Short, respectful and specific','Full of abbreviations','Informal and sarcastic'],1,'Clarity matters more than sounding complicated.']],
practice:[['Appointment message','A patient asks to move Monday’s appointment to Wednesday. Write a professional response that checks availability without promising it.', 'Do not invent a time.'],['De-escalation','A patient says: “Your office is useless. Nobody ever calls me back.” Write a response that acknowledges the frustration and gives a next step.','Do not blame another employee.']],
assessment:[['Patient communication','Write a response to a cancelled appointment where the patient is upset. Include empathy, the action you can take, and the next step.',20],['Phone script','Write a 30-second appointment confirmation call script.',20]]},
{id:'privacy',title:'Privacy, PHI & Data Protection',desc:'Learn the practical privacy habits an MVA needs when handling sensitive information.',skill:'Privacy',minutes:20,lesson:[['Why this matters','Healthcare work involves personal and often sensitive information. Your employer’s policies and applicable law control what you may access, use, disclose and retain. Never use real patient data for this training app.'],['HIPAA in practical terms','For U.S. healthcare work, the HIPAA Privacy Rule regulates protected health information (PHI) handled by covered entities and business associates. A core concept is limiting uses and disclosures to the minimum necessary when that standard applies. Treatment-related provider disclosures are one important exception.'],['Minimum necessary','Think: “Do I need this information to perform this task?” Accessing or sharing extra patient information just because you can is unsafe. Follow the organization’s role-based access and disclosure procedures.'],['Philippine Data Privacy Act','The Philippine Data Privacy Act of 2012 (RA 10173) emphasizes transparency, legitimate purpose and proportionality. In practical terms, collect/use only what is appropriate for a legitimate purpose and protect it from unauthorized access or disclosure.'],['Security habits','Use approved accounts and systems, strong authentication, locked screens, private workspaces, careful recipients, and approved storage. Never paste real patient information into personal tools or this training platform.'],['Escalate incidents','If you accidentally send information to the wrong person, lose a device, expose a record, or notice suspicious access, do not hide it. Follow the employer’s incident-reporting process immediately.']],
quiz:[['Under HIPAA, the “minimum necessary” concept generally means:',['Share the entire chart whenever possible','Limit PHI use/disclosure/request to what is reasonably needed for the purpose when the standard applies','Never share any PHI','Only doctors can access records'],1,'HHS describes minimum necessary as reasonable efforts to limit PHI to what is needed for the intended purpose, subject to exceptions.'],['Which is safest for this course?',['Real patient screenshots','Fictional/synthetic patient data','A friend’s medical record','Copied patient emails'],1,'Training should use fictional data.'],['The Philippine DPA emphasizes:',['Transparency, legitimate purpose and proportionality','Public sharing','No security controls','Unlimited collection'],0,'These are the Act’s general data privacy principles.'],['You sent PHI to the wrong recipient. Best action?',['Delete the sent email and say nothing','Tell a friend','Follow the organization’s incident/escalation procedure promptly','Post about it online'],2,'Potential privacy incidents should be escalated according to the organization’s process.']],
practice:[['Privacy triage','Classify each as SAFE, UNSAFE or ESCALATE: (1) using fictional patients for practice; (2) leaving a real patient chart open on a public computer; (3) using an approved EHR for an assigned task; (4) emailing a patient list to your personal Gmail; (5) accidentally sending a patient record to the wrong address. Explain your choices.', 'Use one line per item.'],['Minimum-necessary scenario','Your supervisor asks you to confirm which patients are scheduled for tomorrow. What information would you access, and what would you avoid accessing unless needed?', 'Think about task purpose and role-based access.']],
assessment:[['Privacy incident','You accidentally send a patient document to the wrong email address. Write the immediate actions you would take. Do not invent a legal reporting deadline; focus on following the employer’s incident procedure.',25],['Data minimization','Explain how you would apply minimum-necessary thinking while preparing a scheduling report.',15]]},
{id:'workspace',title:'Google Workspace & Remote Work',desc:'Build practical habits with Gmail, Drive, Docs, Sheets and remote organization.',skill:'Workspace',minutes:15,lesson:[['Gmail','Use professional subjects, concise messages, clear calls to action and careful recipients. Check attachments and recipients before sending.'],['Drive and Docs','Organize files consistently. Use descriptive names, approved folders and access controls. Avoid public sharing unless explicitly authorized.'],['Sheets','Use headers, consistent formats, filters, sorting and validation. Protect sensitive information and avoid unnecessary fields.'],['Remote-work basics','Use a private workspace, secure Wi-Fi where possible, screen locking, MFA and approved applications. Follow employer policies for devices and storage.']],
quiz:[['Before sending an email with an attachment, you should check:',['Only the font','Recipient, attachment, content and authorization','Nothing','Whether it looks funny'],1,'Recipient and attachment errors are common avoidable risks.'],['A good file name is:',['finalfinal2new.xlsx','Patients maybe.xlsx','2026-10-06_Scheduling_Report.xlsx','stuff.xlsx'],2,'Consistent naming improves retrieval and reduces mistakes.'],['Public Drive sharing should be used:',['Whenever convenient','Only when explicitly authorized and appropriate','For patient records','For passwords'],1,'Access should follow organizational policy and data sensitivity.']],
practice:[['Folder design','Design a folder structure for an MVA: Admin, Scheduling, Reports, Templates, Training and Portfolio. Explain what belongs in each.', 'Keep patient data out of this training exercise.'],['Professional email','Draft an email to a supervisor explaining that you completed today’s scheduling queue and identified two items requiring escalation.', 'Use a clear subject and concise body.']],
assessment:[['File organization','Describe how you would organize a small clinic’s weekly scheduling reports and templates so another VA can find them quickly.',20],['Email quality','Write a professional email confirming completion of a task and flagging one unresolved issue.',20]]},
{id:'data',title:'Data Entry & Spreadsheets',desc:'Practice accuracy, consistency, validation and error checking.',skill:'Data Entry',minutes:18,lesson:[['Accuracy first','In healthcare administration, a fast wrong entry can be worse than a slow correct one. Use source-of-truth records, verify critical fields and document corrections according to policy.'],['Useful fields','A fictional scheduling sheet might contain Patient ID, Patient Name, DOB, Appointment Date, Time, Provider and Status. Only collect fields required for the task.'],['Quality checks','Look for duplicates, missing fields, inconsistent dates, impossible values, incorrect provider names and mismatched appointment times.'],['Audit mindset','Before submitting: compare against the source, check your changes, scan for duplicates and document anything you could not resolve.']],
quiz:[['Best priority in healthcare data entry?',['Speed at any cost','Accuracy, appropriate handling and consistency','Making the sheet colorful','Deleting difficult records'],1,'Accuracy and safe handling are foundational.'],['You see two records with the same patient ID but different names. You should:',['Guess which is correct','Delete one','Pause and verify using the approved source/process','Post it in a group chat'],2,'Ambiguous identity data should be verified, not guessed.'],['A useful data-quality check is:',['Sort/filter and look for duplicates or missing values','Change every value','Hide errors','Skip review'],0,'Basic quality checks catch common administrative errors.']],
practice:[['Fictional data QA','Create 10 fictional patient rows on paper or in a spreadsheet with ID, name, DOB, appointment, provider and status. Intentionally introduce two errors, then describe how you found and corrected them.', 'Do not use real names, dates of birth or identifiers.'],['End-of-day report','Write a short fictional report with completed tasks, unresolved items, escalations and next actions.', 'Aim for 5–8 bullet points.']],
assessment:[['Data quality plan','Describe your process for checking a 50-row scheduling spreadsheet before handing it to a clinic manager.',20],['Error handling','A spreadsheet contains a duplicate patient ID. Explain exactly what you would do without guessing.',20]]},
{id:'scheduling',title:'Scheduling & Patient Coordination',desc:'Operate a scheduling workflow and handle cancellations, no-shows and escalation.',skill:'Scheduling',minutes:20,lesson:[['Scheduling basics','Typical work includes receiving requests, verifying the patient, identifying the correct appointment type, checking availability, booking, confirming details and documenting the outcome.'],['Never invent availability','Use the scheduling system or approved calendar. If you cannot see availability, say you need to check rather than promising a slot.'],['Cancellations and no-shows','Follow the clinic’s policy. Document the event accurately and offer next steps within your authority.'],['Urgent concerns','If a patient reports symptoms that may be urgent, do not diagnose or provide treatment advice. Follow the clinic’s urgent/emergency escalation procedure. If the situation appears to be an emergency, follow the organization’s emergency instructions and direct the person to appropriate emergency services as required by policy.']],
quiz:[['A patient reports severe chest pain while asking for an appointment. You should:',['Diagnose it','Give medication advice','Follow the organization’s urgent/emergency escalation procedure','Put them at the end of the queue'],2,'An MVA should not clinically assess the symptom; use the approved escalation process.'],['A patient wants Wednesday at 2 PM. The calendar is unavailable to you. You should:',['Promise 2 PM','Guess','Tell them you need to verify availability','Book another patient'],2,'Do not invent availability.'],['After successfully booking an appointment, you should generally:',['Do nothing','Document/confirm according to SOP','Delete the request','Ask the patient to remember it'],1,'Closing the loop includes documentation and confirmation.']],
practice:[['Calendar build','Create a fictional Mon–Fri schedule for one provider, 9 AM–5 PM, 30-minute visits and a 12–1 lunch. Include a new patient, follow-up, cancellation, reschedule and no-show.', 'You may use a spreadsheet. Keep all data fictional.'],['Coordination scenario','A patient wants to reschedule, but their preferred time is full. Write what you would say and the steps you would take.', 'Do not promise an unavailable slot.']],
assessment:[['Scheduling simulation','Explain how you would process a cancellation, identify the next available appointment, confirm the patient and document the change.',20],['Escalation','A patient reports a potentially urgent symptom while requesting a routine appointment. Explain your workflow and what you would not do.',20]]},
{id:'ehr',title:'EHR / EMR Fundamentals',desc:'Understand administrative EHR workflows without crossing into clinical decision-making.',skill:'EHR',minutes:18,lesson:[['What an EHR is','An electronic health record stores healthcare information. An MVA may interact with administrative areas such as demographics, scheduling, messages, referrals or task queues depending on permissions.'],['Role-based access','Only access what you need for assigned work. Do not browse charts out of curiosity.'],['Administrative vs clinical changes','Changing an appointment time is administrative. Changing a diagnosis, medication, dose or treatment plan is clinical and requires authorized personnel/workflows.'],['Documentation','Document facts, actions and next steps clearly. Avoid opinions, speculation or unnecessary clinical interpretation.']],
quiz:[['An MVA should open a patient chart:',['For curiosity','Only for an authorized task and according to access rules','Whenever bored','To show a friend'],1,'Access should be tied to job duties.'],['Which is usually administrative?',['Changing a diagnosis','Changing an appointment time','Prescribing','Interpreting a lab result'],1,'Appointment scheduling is administrative.'],['Good documentation is:',['Factual and concise','Speculative','Emotional','Vague'],0,'Administrative notes should be clear and factual.']],
practice:[['Administrative note','Write a fictional note documenting that a patient requested a reschedule, the new appointment was confirmed, and the patient was notified.', 'Do not include clinical information.'],['Access decision','For each: scheduling request, curiosity about a celebrity patient, referral task assigned by supervisor, medication-dose question. State ACCESS or DO NOT ACCESS/ESCALATE and why.', 'Focus on role and purpose.']],
assessment:[['EHR workflow','Describe the steps for updating an appointment while preserving accurate documentation.',20],['Boundary test','Explain what you would do if a supervisor asks you to change a medication dose but your account does not have an authorized workflow for it.',20]]},
{id:'pharmacy',title:'Pharmacy Support',desc:'Translate pharmacy-clerk experience into safe remote administrative workflows.',skill:'Pharmacy Support',minutes:18,lesson:[['Transferable pharmacy skills','Retail/community pharmacy work can demonstrate customer service, inventory awareness, medication-name familiarity, documentation habits and attention to detail. Do not claim clinical authority you did not have.'],['Refill workflow','An MVA may receive or route refill requests depending on the employer. Follow the approved process, verify required information, route to the authorized pharmacy/clinician team and document the request.'],['Inventory administration','Administrative inventory work can include tracking stock, expiration dates and reorder flags. Never change clinical therapy because an item is out of stock.'],['Communication boundary','If a patient asks whether they should change a dose, substitute a medicine or treat a symptom, route the clinical question to authorized personnel.']],
quiz:[['A refill request should generally be:',['Automatically approved','Processed through the approved routing/authorization workflow','Changed if stock is low','Ignored'],1,'Refills can involve clinical authorization; follow the employer’s workflow.'],['Inventory shows a medicine is out of stock. You should:',['Change the patient’s treatment','Document and route the inventory issue according to SOP','Tell the patient to take something else','Hide the shortage'],1,'Inventory administration should not become unauthorized clinical advice.'],['A pharmacy clerk background is valuable because it can show:',['Automatic prescribing authority','Relevant customer service, accuracy and pharmacy workflow exposure','Permission to diagnose','Permission to change doses'],1,'Transferable skills are valuable, but scope still matters.']],
practice:[['Inventory table','Create 15 fictional medication inventory rows with name, strength, form, stock, expiration month and reorder status. Identify 3 items needing attention.', 'Use fictional products/data only.'],['Refill routing','Write an SOP for receiving a refill request by email or phone, verifying required administrative information, routing it to the authorized team and documenting completion.', 'Do not include clinical approval steps you are not authorized to perform.']],
assessment:[['Pharmacy scenario','A patient asks for a refill and then asks whether they can double the dose because it is not working. Write your response and internal routing steps.',25],['Transferable skills','List five real pharmacy-clerk skills that could transfer to an MVA job, without exaggerating your experience.',15]]},
{id:'pharmacy-bridge',title:'Pharmacy Experience to MVA',desc:'Turn real community-pharmacy experience into honest, job-ready MVA evidence.',skill:'Career Transition',minutes:12,lesson:[['Your experience is relevant','Customer service, register accuracy, receiving stock, checking expiration dates, preparing orders, supplier communication, inventory reports and daily sales reports are transferable workplace skills. Explain what you actually did and how you did it.'],['Translate duties into evidence','Instead of saying “I know healthcare,” give a concrete example: “Checked incoming products, organized stock, and flagged items approaching expiration according to pharmacy procedures.” Specific actions are more credible than broad claims.'],['Be honest about software','If the pharmacy owner performed computer encoding and you did not use a pharmacy management system, do not claim EHR, EMR, POS or clinical software experience. You can say you are building digital documentation, spreadsheet and EHR-workflow skills through training.'],['Know the boundary','Pharmacy familiarity is not prescribing authority. In remote work, route dose questions, medication substitutions, symptoms and clinical decisions to authorized personnel under the employer’s SOP.'],['Build a portfolio safely','Use fictional data to create a sample inventory sheet, a daily task report, a professional email and a refill-routing checklist. Never include real customers, prescriptions or pharmacy business records.']],quiz:[['Which résumé statement is strongest and honest?',['Managed EHR records independently','Checked incoming products, organized stock and monitored expiration dates','Provided clinical medication counseling','Processed insurance claims'],1,'Specific duties she actually performed are stronger than invented software or clinical experience.'],['If the pharmacy owner handled computer encoding, she should:',['Claim advanced data-entry experience anyway','Explain her real duties and demonstrate new skills with practice projects','Say she used a pharmacy system','Avoid mentioning any pharmacy experience'],1,'Show the experience she has and build evidence for skills she is still learning.'],['A patient asks whether to double a medication dose. She should:',['Give advice based on retail experience','Suggest a substitute','Route the clinical question to authorized personnel','Approve it if the medicine is familiar'],2,'Medication decisions must stay with authorized clinical personnel.'],['Which is a safe portfolio item?',['A real prescription photo','A real customer list','A fictional inventory spreadsheet with invented products and IDs','A screenshot of the pharmacy register'],2,'Portfolio materials must not expose real customer or employer information.']],practice:[['Transferable-skill inventory','Make a two-column list of at least six real pharmacy duties and the MVA skill each demonstrates. Include customer service, cash handling, stock receiving, expiry checks, reports and supplier coordination where applicable.','For each item, describe evidence rather than just naming a skill.'],['Portfolio project plan','Plan three fictional portfolio samples: an inventory tracker, an end-of-day task report and a professional email. For each, write what it demonstrates and how you will verify accuracy.','Use only synthetic data and do not reproduce employer records.']],assessment:[['Interview answer','Answer: “You have not worked as a Medical Virtual Assistant before. Why should we consider you?” Use real pharmacy experience, transferable skills and the skills you are actively developing.',20],['Experience boundary','Write a short statement explaining what you did in the pharmacy, what computer/software tasks you did not perform there, and how you are building those skills now.',20]]},{id:'research',title:'Research, Documentation & SOPs',desc:'Find trustworthy information, document sources and turn repeated work into checklists.',skill:'Research',minutes:15,lesson:[['Source hierarchy','For healthcare policies, prefer official government agencies, the employer’s approved references, professional organizations and primary sources. Be cautious with random blogs, forums and social posts.'],['Document your research','Record the source, date checked, key point and what still needs clarification. This makes your work reproducible.'],['SOPs','A good SOP says when the workflow starts, required inputs, steps, decision points, escalation rules, documentation and completion criteria.'],['Do not improvise policy','If a source conflicts with the employer’s SOP, stop and ask the appropriate supervisor rather than silently choosing one.']],
quiz:[['Best source for a clinic policy?',['Random social media post','Employer-approved policy/reference','Anonymous forum','Influencer video'],1,'The organization’s approved policy is the operational source of truth.'],['A research log should include:',['Source and date checked','Only a screenshot','Your memory','No evidence'],0,'A source log makes research auditable.'],['If an SOP is unclear about a sensitive step, you should:',['Guess','Ask for clarification/escalate','Invent a new policy','Ignore it'],1,'Ambiguity should be resolved through the appropriate authority.']],
practice:[['Research log','Choose an official public healthcare source and write: source title, organization, URL, date checked, three useful points and one question requiring clarification.', 'Do not copy long passages. Summarize in your own words.'],['SOP builder','Write an SOP for appointment confirmation with Purpose, Inputs, Steps, Exceptions/Escalation and Completion Criteria.', 'Make it usable by another VA.']],
assessment:[['SOP quality','Write a complete appointment-rescheduling SOP that another beginner VA could follow.',25],['Research judgment','Explain how you would verify a healthcare-related claim before using it in work.',15]]},
{id:'workplace',title:'Workplace Simulation',desc:'Combine inbox, scheduling, privacy, documentation and escalation into a realistic shift.',skill:'Workplace',minutes:25,lesson:[['The simulated shift','You will process a small queue of fictional tasks. Treat each item like a real work ticket: understand, verify, act within role, document and escalate.'],['Prioritization','Separate routine work from time-sensitive or potentially urgent requests. Follow the organization’s escalation rules rather than making your own clinical triage decisions.'],['Quality standard','A good shift is not simply “everything completed.” It is accurate, properly documented, privacy-safe and appropriately escalated.']],
quiz:[['Which task should receive the most careful escalation handling?',['Routine address update','Potentially urgent patient symptom','Folder rename','Template formatting'],1,'Potentially urgent clinical concerns require the appropriate escalation pathway.'],['What makes a ticket “complete”?',['You typed something','The requested workflow was completed, documented and any exceptions escalated','You ignored it','You deleted it'],1,'Completion includes closing the loop.'],['When uncertain about a policy-sensitive task:',['Guess','Follow SOP or escalate for clarification','Ask the patient to decide','Post online'],1,'Use the organization’s approved workflow.']],
practice:[['Shift queue','Process these fictional tickets in writing: A) patient wants appointment moved; B) wrong recipient received a document; C) refill request; D) provider asks for tomorrow’s schedule; E) patient reports a potentially urgent symptom. For each, state priority, action, escalation and documentation.', 'Do not invent legal deadlines or clinical advice.'],['End-of-shift handoff','Write a concise handoff for the next VA listing completed items, pending items and escalations.', 'Use bullet points.']],

const state=(()=>{try{const s=JSON.parse(localStorage.getItem('mvaV2')||'{}');s.profile=s.profile||{};s.modules=s.modules||{};s.active=s.active||'foundations';s.tab=s.tab||'learn';s.sim=s.sim||{};s.schemaVersion=3;return s}catch(e){return {profile:{},modules:{},active:'foundations',tab:'learn',sim:{},schemaVersion:3}}})();
const save=()=>{localStorage.setItem('mvaV2',JSON.stringify(state));updateTop();nav()};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function mod(id){return modules.find(x=>x.id===id)}
function moduleData(id){state.modules[id]=state.modules[id]||{};return state.modules[id]}
function learned(id){return !!moduleData(id).learnedAt}
function practiceComplete(id){let m=mod(id),a=moduleData(id).practice||{};return m.practice.every((_,i)=>String(a[i]||'').trim().length>=20)}
function assessmentSubmitted(id){return !!moduleData(id).assessmentSubmittedAt}
function reviewerScore(id){let m=mod(id),a=moduleData(id).assessment||{};let vals=m.assessment.map((_,i)=>Number(a['review'+i])).filter(Number.isFinite);return vals.length===m.assessment.length?Math.round(vals.reduce((x,y)=>x+y,0)/vals.length):0}
function completed(id){let m=moduleData(id);return !!m.complete}
function stage(id){if(completed(id))return 'Mastered';if(!learned(id))return 'Learn';if(quizScore(id)<80)return 'Quiz';if(!practiceComplete(id))return 'Practice';if(!assessmentSubmitted(id))return 'Assessment';if(reviewerScore(id)<80)return 'Retry';return 'Mastery'}
function quizScore(id){let m=mod(id),a=(state.modules[id]||{}).quiz||{},n=m.quiz.length;let c=m.quiz.reduce((z,q,i)=>z+(a[i]===q[2]?1:0),0);return n?Math.round(c/n*100):0}
function practicalScore(id){return reviewerScore(id)}
function learnerWeaknesses(){return modules.map(m=>({m,score:Math.round(quizScore(m.id)*.45+practicalScore(m.id)*.55)})).sort((a,b)=>a.score-b.score)}
function renderCoachChat(){let h=state.sim.coachChat||[];document.getElementById('app').innerHTML='<section class="card hero"><span class="muted">🤖 MVA COACH</span><h2>Practice with your AI coach</h2><p>Ask about role boundaries, privacy, communication, scheduling, documentation or a training task. The coach is educational and will flag uncertainty rather than invent rules.</p><div class="task">'+h.map(z=>'<div class="callout"><b>'+esc(z.role==='user'?'You':'Coach')+':</b> '+esc(z.text)+'</div>').join('')+'</div><textarea id="coachInput" class="textarea" placeholder="Ask your coach..."></textarea><button class="primary" onclick="askCoach()">Ask Coach →</button><button class="secondary" onclick="showCoach()">Back to priority queue</button></section>'}
async function askCoach(){let input=document.getElementById('coachInput'),q=input.value.trim();if(!q)return;state.sim.coachChat=state.sim.coachChat||[];state.sim.coachChat.push({role:'user',text:q});save();renderCoachChat();try{let r=await fetch('/api/coach.js',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:q,history:state.sim.coachChat.slice(-10),module:mod(state.active)?.title||'General MVA training'})});let d=await r.json();if(!r.ok)throw Error(d.error||'Coach unavailable');state.sim.coachChat.push({role:'assistant',text:d.reply});save();renderCoachChat()}catch(e){state.sim.coachChat.push({role:'assistant',text:'I could not reach the coach right now. '+e.message});save();renderCoachChat()}}
function showCoach(){state.active='coach';save();renderCoach()}function showWorkday(){state.active='workday';save();renderWorkday()}function showInterview(){state.active='interview';save();renderInterview()}function showReadiness(){state.active='readiness';save();renderReadiness()}
function renderCoach(){let w=learnerWeaknesses().slice(0,3),x=w[0]?.m;document.getElementById('app').innerHTML='<section class="card hero"><span class="muted">V3 ADAPTIVE COACH</span><h2>What should you work on next?</h2><div class="callout"><b>'+esc(x?'Focus on '+x.title:'Start with MVA Foundations')+'</b><br>'+esc(x?'Your weakest area is currently '+x.title+'. Continue its next available stage.':'Begin by studying the Foundations lesson.')+'</div><h3>Priority queue</h3>'+w.map((z,i)=>'<div class="modulecard"><b>'+(i+1)+'. '+esc(z.m.title)+'</b><div class="small">Competency estimate: '+z.score+'% • Stage: '+esc(stage(z.m.id))+'</div><button class="primary" onclick="openModule(\''+z.m.id+'\')">Continue →</button></div>').join('')+'</section>'}const workTickets=[['SCHED-104','Scheduling','Move an appointment.','Normal'],['PRIV-221','Privacy','A document went to the wrong recipient.','High'],['REF-310','Pharmacy','A patient requests a refill and asks about doubling the dose.','High'],['ADMIN-412','Provider support','Prepare tomorrow’s schedule.','Normal'],['CLIN-509','Patient message','A patient reports a potentially urgent symptom.','High']];
function renderWorkday(){let a=state.sim.workday||{};document.getElementById('app').innerHTML='<section class="card hero"><span class="muted">V3 WORKDAY SIMULATION</span><h2>Process a fictional MVA queue</h2><p>For each ticket, write your action, escalation and documentation. Do not provide clinical advice.</p>'+workTickets.map((t,i)=>'<div class="task"><h3>'+esc(t[0])+' · '+esc(t[1])+' <span class="pill">'+t[3]+'</span></h3><p>'+esc(t[2])+'</p><textarea class="textarea" oninput="setWorkday('+i+',this.value)" placeholder="Action, message, escalation and documentation...">'+esc(a[i]||'')+'</textarea></div>').join('')+'<button class="primary" onclick="gradeWorkday()">Submit shift →</button><div id="workresult"></div></section>'}
function setWorkday(i,v){state.sim.workday=state.sim.workday||{};state.sim.workday[i]=v;save()}function gradeWorkday(){let a=state.sim.workday||{},n=workTickets.filter((_,i)=>String(a[i]||'').trim().length>=30).length,s=Math.round(n/workTickets.length*100);state.sim.workdayScore=s;save();document.getElementById('workresult').innerHTML='<div class="scorebox"><b>Shift completion: '+s+'%</b><br>Every ticket needs a complete action and escalation/documentation decision.</div>'}
const interviewQuestions=[['Role boundaries','A patient asks you to change their medication dose. What do you say and do next?'],['Privacy','How would you protect sensitive patient information while working remotely?'],['Scheduling','A patient requests a time that may not be available. How do you handle it?'],['Accuracy','You discover a duplicate patient ID. What is your process?'],['Communication','A frustrated patient says nobody called back. How do you respond?'],['Escalation','When would you stop and ask a supervisor for clarification?']];
function renderInterview(){let a=state.sim.interview||{};document.getElementById('app').innerHTML='<section class="card hero"><span class="muted">V3 INTERVIEW SIMULATOR</span><h2>Practice MVA interview answers</h2><p>Answer aloud first, then type your answer.</p>'+interviewQuestions.map((q,i)=>'<div class="task"><h3>'+esc(q[0])+'</h3><p>'+esc(q[1])+'</p><textarea class="textarea" oninput="setInterview('+i+',this.value)" placeholder="Your answer...">'+esc(a[i]||'')+'</textarea></div>').join('')+'<button class="primary" onclick="gradeInterview()">Review answers →</button><div id="interviewresult"></div></section>'}
function setInterview(i,v){state.sim.interview=state.sim.interview||{};state.sim.interview[i]=v;save()}function gradeInterview(){let a=state.sim.interview||{},n=interviewQuestions.filter((_,i)=>String(a[i]||'').trim().length>=50).length,s=Math.round(n/interviewQuestions.length*100);state.sim.interviewScore=s;save();document.getElementById('interviewresult').innerHTML='<div class="scorebox"><b>Answer completeness: '+s+'%</b><br>Strong answers should be specific, role-aware and include the next action.</div>'}
function renderReadiness(){let mastered=modules.filter(completed).length,avg=Math.round(modules.reduce((s,m)=>s+Math.round(quizScore(m.id)*.45+practicalScore(m.id)*.55),0)/modules.length),work=state.sim.workdayScore||0,interview=state.sim.interviewScore||0;document.getElementById('app').innerHTML='<section class="card hero"><span class="muted">V3 READINESS PROFILE</span><h2>'+(mastered===modules.length&&avg>=80&&work>=80&&interview>=80?'MVA Job-Ready':'MVA Readiness in Progress')+'</h2><p>Training evidence only — not a certification or employment guarantee.</p><div class="grid"><div class="stat"><span class="muted">Modules mastered</span><b>'+mastered+'/'+modules.length+'</b></div><div class="stat"><span class="muted">Competency average</span><b>'+avg+'%</b></div><div class="stat"><span class="muted">Workday</span><b>'+work+'%</b></div></div><div class="scorebox"><b>Interview practice: '+interview+'%</b></div><h3>Weakest areas</h3><ul>'+learnerWeaknesses().slice(0,3).map(z=>'<li>'+esc(z.m.title)+' — '+z.score+'%</li>').join('')+'</ul><button class="primary" onclick="exportData()">Export readiness evidence →</button></section>'}
function nav(){document.getElementById('nav').innerHTML=modules.map((m,i)=>`<button class="navbtn ${state.active===m.id?'on':''}" onclick="openModule('${m.id}')">${i+1}. ${esc(m.title)}<span class="pill ${completed(m.id)?'good':''}">${completed(m.id)?'✓':stage(m.id)}</span><small>${esc(m.desc)}</small></button>`).join('')}
function updateTop(){let n=modules.filter(m=>completed(m.id)).length,p=Math.round(n/modules.length*100);document.getElementById('topstats').textContent=`${p}% complete • ${n}/${modules.length} modules completed`;document.getElementById('bar').style.width=p+'%'}
function showDashboard(){state.active='dashboard';save();renderDashboard()}
function openModule(id){state.active=id;state.tab='learn';save();renderModule()}
function tabs(m){return `<div class="tabs"><button class="tab ${state.tab==='learn'?'on':''}" onclick="setTab('learn')">📖 Learn</button><button class="tab ${state.tab==='quiz'?'on':''}" onclick="setTab('quiz')">🧠 Quiz</button><button class="tab ${state.tab==='practice'?'on':''}" onclick="setTab('practice')">🛠 Practice</button><button class="tab ${state.tab==='assessment'?'on':''}" onclick="setTab('assessment')">🎯 Assessment</button></div>`}
function setTab(t){let m=mod(state.active);if(t==='quiz'&&!learned(m.id)){alert('Complete the Learn stage first.');return}if(t==='practice'&&quizScore(m.id)<80){alert('Pass the quiz with at least 80% first.');return}if(t==='assessment'&&(quizScore(m.id)<80||!practiceComplete(m.id))){alert('Pass the quiz and complete every practice response first.');return}state.tab=t;save();renderModule()}
function renderDashboard(){let avg=Math.round(modules.reduce((s,m)=>s+quizScore(m.id),0)/modules.length),ready=modules.filter(completed).length>=modules.length? 'READY FOR FINAL REVIEW':'IN TRAINING';document.getElementById('app').innerHTML=`<div class="dashboard"><section class="card hero"><h2>${esc(state.profile.name||'MVA Learner')} Dashboard</h2><p class="muted">Learn the concept, prove knowledge, practice the workflow, then pass the competency assessment.</p><div class="grid"><div class="stat"><span class="muted">Modules</span><b>${modules.filter(m=>completed(m.id)).length}/${modules.length}</b></div><div class="stat"><span class="muted">Quiz average</span><b>${avg}%</b></div><div class="stat"><span class="muted">Status</span><b style="font-size:18px">${ready}</b></div></div></section><section class="card content"><h2>Profile</h2><div class="profile field"><label>Name<input id="pname" value="${esc(state.profile.name||'')}" placeholder="Learner name"></label><label>Goal<input id="pgoal" value="${esc(state.profile.goal||'')}" placeholder="e.g. Remote MVA job"></label></div><button class="primary" onclick="saveProfile()">Save Profile</button></section><section class="card content"><h2>Skill Map</h2>${skillMap()}</section><section class="card content"><h2>Your Personalized Learning Pathway</h2><p class="muted">Designed for learners with community-pharmacy experience who are transitioning into entry-level remote medical administration.</p><div class="grid"><div class="stat"><span class="muted">Existing strengths to leverage</span><b style="font-size:15px">Customer service</b><p class="mini">Cash/register accuracy, stock receiving, expiry checks, order preparation, supplier coordination and routine reports.</p></div><div class="stat"><span class="muted">Skills to build next</span><b style="font-size:15px">Digital workflows</b><p class="mini">Spreadsheet quality checks, professional remote communication, scheduling, EHR concepts and privacy-safe documentation.</p></div><div class="stat"><span class="muted">Training rule</span><b style="font-size:15px">Evidence, not exaggeration</b><p class="mini">Use fictional portfolio data. Do not claim software, insurance, clinical or computer-encoding experience unless you have actually done it.</p></div></div><p><b>Recommended order:</b> Pharmacy Support → Pharmacy Experience to MVA → Data Entry → Healthcare Communication → Scheduling → EHR Fundamentals → Workplace Simulation.</p></section><section class="card content"><h2>Course Modules</h2>${modules.map((m,i)=>`<div class="modulecard"><h3>${i+1}. ${esc(m.title)}</h3><div class="small">${esc(m.desc)} • ${m.minutes} min</div><div style="margin-top:8px">Quiz: <b>${quizScore(m.id)}%</b> • Practical: <b>${practicalScore(m.id)}%</b> • ${completed(m.id)?'<b style="color:var(--good)">Completed</b>':'Not completed'}</div><button class="primary" onclick="openModule('${m.id}')">${completed(m.id)?'Review':'Start'} module</button></div>`).join('')}</section></div>`}
function skillMap(){return `<div>${modules.map(m=>{let s=Math.round((quizScore(m.id)*.45+practicalScore(m.id)*.55));return `<div class="skillrow"><span>${esc(m.skill)}</span><div class="skillbar"><i style="width:${s}%"></i></div><b>${s}%</b></div>`}).join('')}</div>`}
function renderModule(){let m=mod(state.active);if(!m){showDashboard();return}if(state.tab==='quiz'&&!learned(m.id))state.tab='learn';if(state.tab==='practice'&&quizScore(m.id)<80)state.tab='quiz';if(state.tab==='assessment'&&(quizScore(m.id)<80||!practiceComplete(m.id)))state.tab='practice';let body=state.tab==='learn'?renderLearn(m):state.tab==='quiz'?renderQuiz(m):state.tab==='practice'?renderPractice(m):renderAssessment(m);document.getElementById('app').innerHTML=`<section class="card"><div class="hero"><span class="muted">${m.minutes} MINUTE MODULE</span><h2>${esc(m.title)}</h2><p>${esc(m.desc)}</p><div class="callout"><b>Training rule:</b> use fictional/synthetic patient data only. Follow your employer’s SOPs when working with real data.</div></div>${tabs(m)}<div class="content">${body}</div></section>`}
function renderLearn(m){return `<article class="lesson"><h2>Learn before you test</h2>${m.lesson.map((x,i)=>`<section><h3>${i+1}. ${esc(x[0])}</h3><p>${esc(x[1])}</p></section>`).join('')}<div class="notice"><b>Key takeaway:</b> Know what is inside your role, what requires an approved workflow, and when to escalate.</div>${m.id==='privacy'?`<div class="source"><b>Authoritative references:</b> <a href="https://www.hhs.gov/hipaa/for-professionals/privacy/guidance/minimum-necessary-requirement/index.html" target="_blank" rel="noopener">HHS — Minimum Necessary</a> · <a href="https://privacy.gov.ph/data-privacy-act-/" target="_blank" rel="noopener">Philippine NPC — RA 10173</a> · <a href="https://privacy.gov.ph/implementing-rules-regulations-data-privacy-act-2012/" target="_blank" rel="noopener">NPC — DPA IRR</a></div>`:''}<div class="scorebox"><b>Learn stage: ${learned(m.id)?'Complete ✓':'Not completed'}</b><br><span class="mini">Read the material before unlocking the knowledge check.</span></div><button class="primary" onclick="completeLearning()">${learned(m.id)?'Learning complete ✓':'I finished studying — unlock the quiz'}</button></article>`}
function renderQuiz(m){let q=(state.modules[m.id]||{}).quiz||{};return `<h2>Knowledge Check</h2><p class="muted">Aim for at least 80%. Read the explanation after each answer.</p>${m.quiz.map((x,i)=>`<div class="question"><b>${i+1}. ${esc(x[0])}</b>${x[1].map((o,j)=>`<label class="option"><input type="radio" name="q${i}" value="${j}" ${q[i]===j?'checked':''} onchange="setQuiz(${i},${j})"> ${esc(o)}</label>`).join('')}<div id="qr${i}"></div></div>`).join('')}<button class="primary" onclick="gradeQuiz()">Grade quiz</button><div id="quizscore"></div>`}
function completeLearning(){moduleData(state.active).learnedAt=new Date().toISOString();save();state.tab='quiz';renderModule()}
function setQuiz(i,v){state.modules[state.active]=state.modules[state.active]||{};state.modules[state.active].quiz=state.modules[state.active].quiz||{};state.modules[state.active].quiz[i]=v;save()}
function gradeQuiz(){let m=mod(state.active),s=quizScore(m.id),el=document.getElementById('quizscore');m.quiz.forEach((q,i)=>{let r=document.getElementById('qr'+i),ok=(state.modules[m.id]?.quiz||{})[i]===q[2];r.innerHTML=`<div class="result" style="color:${ok?'var(--good)':'var(--bad)'}">${ok?'Correct':'Review'} — ${esc(q[3])}</div>`});el.innerHTML=`<div class="scorebox"><b>Quiz score: ${s}%</b> ${s>=80?'✓ Strong enough to continue to practice.':'— Review the learning material and try again.'}</div>`;save()}
function renderPractice(m){let a=moduleData(m.id).practice||{};let locked=quizScore(m.id)<80;return `<h2>Hands-on Practice</h2><p class="muted">These are workplace-style exercises. Write your answer as if a supervisor will review it.</p>${m.practice.map((x,i)=>`<div class="task"><h3>${i+1}. ${esc(x[0])}</h3><p>${esc(x[1])}</p><div class="callout">${esc(x[2])}</div><textarea class="textarea" ${locked?'disabled':''} oninput="setPractice(${i},this.value)" placeholder="Write your answer here...">${esc(a[i]||'')}</textarea></div>`).join('')}<button class="primary" ${locked?'disabled':''} onclick="setTab('assessment')">${practiceComplete(m.id)?'Continue to assessment →':'Save practice and continue →'}</button>`}
function setPractice(i,v){state.modules[state.active]=state.modules[state.active]||{};state.modules[state.active].practice=state.modules[state.active].practice||{};state.modules[state.active].practice[i]=v;save()}
function aiAssessmentPercent(id){let a=moduleData(id).assessment||{},m=mod(id),got=0,max=0;for(let i=0;i<m.assessment.length;i++){let q=a['ai'+i];if(q){got+=Number(q.score)||0;max+=Number(q.maxScore)||Number(m.assessment[i][1])}}return max?Math.round(got/max*100):0}
function renderAssessment(m){let a=moduleData(m.id).assessment||{};let locked=quizScore(m.id)<80||!practiceComplete(m.id);let submitted=assessmentSubmitted(m.id);return `<h2>Competency Assessment</h2><p class="muted">This is the part to take seriously. Write complete answers. The app stores your responses so they can be reviewed later.</p>${m.assessment.map((x,i)=>`<div class="task"><h3>${i+1}. ${esc(x[0])} <span class="pill">${x[1]} pts</span></h3><textarea class="textarea" ${locked||submitted?'disabled':''} oninput="setAssessment(${i},this.value)" placeholder="Write your best answer...">${esc(a[i]||'')}</textarea><div id="air${i}"></div><button class="secondary" ${locked||submitted?'disabled':''} onclick="assessWithAI(${i})">🤖 Get AI feedback</button>${submitted?`<div class="rubric" style="margin-top:10px"><span>Reviewer score (0–${x[1]})</span><select onchange="setReviewScore(${i},this.value)"><option value="">Not reviewed</option>${Array.from({length:x[1]+1},(_,n)=>`<option value="${n}" ${Number(a['review'+i])===n?'selected':''}>${n}</option>`).join('')}</select></div>`:''}</div>`).join('')}<div class="scorebox"><b>Status: ${submitted?(reviewerScore(m.id)?`Reviewed — ${reviewerScore(m.id)}%`:'Awaiting reviewer scores'):'Ready for submission'}</b><br><span class="mini">A reviewer must score every task. A module passes at 80% or higher.<br>AI competency estimate: ${aiAssessmentPercent(m.id)}%</span></div>${!submitted?`<button class="primary" ${locked?'disabled':''} onclick="submitAssessment()">Submit for competency review →</button>`:`<button class="primary" onclick="completeModule()">Apply review and update mastery</button>`}`}
function renderAiResult(i,r){let e=document.getElementById('air'+i);if(!e)return;e.innerHTML='<div class="callout"><b>AI assessor: '+esc(r.score)+'/'+esc(r.maxScore)+' — '+esc(r.verdict)+'</b><p><b>Strengths:</b> '+esc((r.strengths||[]).join(' '))+'</p><p><b>Gaps:</b> '+esc((r.gaps||[]).join(' '))+'</p><p>'+esc(r.feedback||'')+'</p><p><b>Retry advice:</b> '+esc(r.retryAdvice||'')+'</p></div>'}
async function assessWithAI(i){let m=mod(state.active),a=moduleData(m.id).assessment||{},x=m.assessment[i],answer=String(a[i]||'').trim();if(answer.length<30){alert('Write a complete answer before requesting AI feedback.');return}let e=document.getElementById('air'+i);e.innerHTML='<div class="small">AI assessor is reviewing this response…</div>';try{let r=await fetch('/api/assess.js',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({module:m.title,question:x[0],answer,points:x[1],reference:(m.lesson||[]).map(z=>z.join(': ')).join('\n')})});let d=await r.json();if(!r.ok)throw Error(d.error||'Assessment failed');moduleData(m.id).assessment['ai'+i]=d;save();renderAiResult(i,d)}catch(err){e.innerHTML='<div class="result" style="color:var(--bad)">AI assessment unavailable: '+esc(err.message)+'</div>'}}
function setAssessment(i,v){state.modules[state.active]=state.modules[state.active]||{};state.modules[state.active].assessment=state.modules[state.active].assessment||{};state.modules[state.active].assessment[i]=v;save()}
function setReviewScore(i,v){moduleData(state.active).assessment=moduleData(state.active).assessment||{};moduleData(state.active).assessment['review'+i]=v;save()}
function submitAssessment(){let m=mod(state.active);if(quizScore(m.id)<80){alert('Pass the quiz with at least 80% first.');state.tab='quiz';save();renderModule();return}if(!practiceComplete(m.id)){alert('Complete every practice response before submitting.');state.tab='practice';save();renderModule();return}let a=moduleData(m.id).assessment||{};if(m.assessment.some((_,i)=>String(a[i]||'').trim().length<30)){alert('Please complete every assessment response before submitting.');return}moduleData(m.id).assessmentSubmittedAt=new Date().toISOString();moduleData(m.id).complete=false;save();renderModule();alert('Assessment submitted for competency review. A reviewer must score each task before mastery is awarded.')}
function completeModule(){let m=mod(state.active);if(!assessmentSubmitted(m.id)){alert('Submit the assessment for review first.');return}if(reviewerScore(m.id)<80){alert('The reviewed score is below 80%. Review the feedback and retry this module.');moduleData(m.id).complete=false;save();return}moduleData(m.id).complete=true;moduleData(m.id).mastery={level:'mastered',score:reviewerScore(m.id),at:new Date().toISOString()};save();alert('Module mastered. Great work.');renderDashboard()}
function saveProfile(){state.profile.name=document.getElementById('pname').value.trim();state.profile.goal=document.getElementById('pgoal').value.trim();save();renderDashboard()}
function exportData(){let payload={course:'MVA Launchpad',version:'3.1',exportedAt:new Date().toISOString(),profile:state.profile,modules:state.modules,skillSummary:modules.map(m=>({id:m.id,title:m.title,skill:m.skill,quiz:quizScore(m.id),practical:practicalScore(m.id),complete:completed(m.id)}))};let b=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='mva-launchpad-v3-'+new Date().toISOString().slice(0,10)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function importFile(){document.getElementById('file').click()}
function readImport(e){let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let d=JSON.parse(r.result);if(!d.modules)throw Error('Not an MVA Launchpad export');state.profile=d.profile||{};state.modules=d.modules||{};save();renderDashboard();alert('Progress imported successfully.')}catch(err){alert('Import failed: '+err.message)}};r.readAsText(f)}
function resetAll(){if(confirm('Reset all MVA Launchpad V2 progress on this browser? Export first if you need the data.')){localStorage.removeItem('mvaV2');location.reload()}}
nav();updateTop();showDashboard();
</script></body></html>
